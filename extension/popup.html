<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wordle Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Wordle <span>Optimizer</span></h1>
    <div class="actions">
      <button id="open-sidebar" class="icon" title="Open in sidebar (stays open while you play)" aria-label="Open in sidebar">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><rect x="10" y="3" width="4" height="10" fill="currentColor"/></svg>
      </button>
      <button id="reset" class="link" title="Start a new game">New game</button>
    </div>
  </header>

  <div id="history" class="board"></div>

  <section id="entry">
    <p class="status" id="status"></p>
    <div class="suggestion">Suggested <strong id="suggestion" title="Use this word"></strong></div>

    <div id="tiles" class="row entry-row" tabindex="0" role="textbox"
         aria-label="Type your guess, then click each tile to set its color"></div>
    <p class="hint">Type your guess, or press Enter to use the suggestion. Click a tile to change its color: gray → yellow → green. Press Enter to submit.</p>

    <p class="error" id="error"></p>
    <button id="submit" class="primary">Submit</button>
  </section>

  <section id="result" hidden>
    <p id="result-text"></p>
    <ul id="remaining"></ul>
  </section>

  <details id="candidates-box">
    <summary>Possible words (<span id="cand-count">0</span>)</summary>
    <p id="candidates"></p>
  </details>

  <script src="solver.js"></script>
  <script src="popup.js"></script>
</body>
</html>
